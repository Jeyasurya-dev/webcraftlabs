{% extends "base.html" %}
{% block title %}Something Went Wrong — {{ brand_name }}{% endblock %}
{% block content %}
<section class="error-page">
  <div class="code">500</div>
  <h2 style="margin:16px 0 12px;">Something went wrong on our end</h2>
  <p style="margin-bottom:28px;">Please try again in a moment. If this keeps happening, get in touch with us.</p>
  <a href="{{ url_for('public.home') }}" class="btn btn-primary">Back to Home</a>
</section>
{% endblock %}
